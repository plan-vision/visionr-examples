name: Build on Linux (Ubuntu)

permissions:
  contents: write  # Needed for 'gh release create' to work with GITHUB_TOKEN

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

# linux does downloading and extraction fast, skip cache configuration

jobs:
  build-ubuntu:
    name: Linux (Ubuntu) build
    runs-on: ubuntu-26.04

    env:
      VISIONR_VERSION: latest
      PROJECT_NAME: visionr-examples

    steps:
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install VisionR-Engine Globally (Linux)
        if: steps.cache-visionr.outputs.cache-hit != 'true'
        run: |
          ASSET_URL=$(curl --fail --silent --show-error --location https://api.github.com/repos/plan-vision/visionr-engine.binary/releases/latest | jq --exit-status --raw-output '
            .tag_name as $version
            | [.assets[] | select(.name == ("visionr-engine-NPM-package-" + $version + ".tgz")) | .browser_download_url]
            | if length == 1 then .[0] else error("Expected exactly one VisionR npm .tgz release asset") end
          ')
          echo "Installing VisionR-Engine globally from release npm package $ASSET_URL ..."
          npm install -g "$ASSET_URL"

      - name: Compile release and upload to GitHub  
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          npm run release
        shell: bash
